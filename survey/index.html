<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>本日の感想アンケート</title>
<style>
:root{--bg:#DEEEFF;--card:#fff;--edge:#BBD9F5;--soft:#EEF5FE;--callout:#CEE6FD;--head:#091C53;--ink:#1E3063;--ink2:#44527A;--mute:#6C7898;--accent:#0B5CD5;--red:#B4412B;--green:#1F7A57;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;line-height:1.7}
.card{max-width:640px;margin:16px auto;background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:0 0 0 1px var(--edge),5px 5px 0 0 var(--edge)}
h1{font-size:22px;color:var(--head);margin:0 0 4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 6px}
fieldset{border:0;margin:22px 0 0;padding:0}
legend{font-weight:700;color:var(--head);font-size:17px;margin-bottom:8px;padding:0}
legend small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.opts{display:grid;gap:8px}
.opts.five{grid-template-columns:repeat(5,1fr)}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--edge);border-radius:12px;background:var(--soft);cursor:pointer;font-size:16px}
.five .opt{flex-direction:column;gap:2px;padding:10px 4px;text-align:center;font-size:13px}
.five .opt b{font-size:22px;color:var(--head)}
.opt input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.five .opt input{position:absolute;opacity:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--callout)}
textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--edge);border-radius:12px;padding:10px 12px;min-height:88px;background:var(--soft)}
.count{font-size:12px;color:var(--mute);text-align:right}
button.send{margin-top:22px;width:100%;font:inherit;font-weight:700;font-size:18px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button.send:disabled{opacity:.5}
.msg{min-height:1.5em;margin-top:10px;font-size:15px}
.msg.err{color:var(--red)} .done{text-align:center;padding:30px 10px}
.done b{display:block;font-size:24px;color:var(--green);margin-bottom:6px}
.note{font-size:12px;color:var(--mute);margin-top:14px}
/* 投影用 */
.board{max-width:1500px;margin:0 auto;padding:24px 28px}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.bhead h1{font-size:clamp(28px,3.2vw,44px)}
.qr{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 0 0 1px var(--edge),5px 5px 0 0 var(--edge);flex:none}
.qr svg{width:200px;height:200px;display:block}
.qr .url{font-size:16px;font-weight:700;color:var(--head);margin-top:6px;word-break:break-all}
.total{font-size:clamp(20px,2vw,28px);color:var(--ink2);margin-top:6px}
.total b{font-size:clamp(44px,5vw,72px);color:var(--accent);font-variant-numeric:tabular-nums;margin:0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.panel{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 0 0 1px var(--edge)}
.panel h2{font-size:clamp(18px,1.7vw,24px);color:var(--head);margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 3.2em;align-items:center;gap:10px;margin:8px 0;font-size:clamp(14px,1.3vw,18px)}
.bar .t{display:block;height:26px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .f{display:block;height:100%;background:var(--accent);border-radius:6px;width:0;transition:width .6s}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--head)}
.bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mute);font-size:14px}
.bfoot button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
@media (max-width:900px){.grid{grid-template-columns:1fr}.bhead{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 設定（ここだけ書き換える） ===== */
var CFG = {
  url: 'https://bhkjcanqzpcxmlxwerle.supabase.co',          // 例: https://xxxx.supabase.co
  key: 'sb_publishable_tFvxe1ZrMaJ3JJFLDDhkEg_dn8iz-wD', // 公開してよい publishable key
  publicUrl: 'https://itec-ai-lecture.vercel.app/survey/',      // 参加者に見せるURL（QRの中身）
  qrSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 33 33\" class=\"segno\"><path class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m3 0h3m2 0h1m2 0h2m2 0h7m-29 1h1m5 0h1m3 0h2m2 0h2m1 0h2m3 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m2 0h1m1 0h4m1 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h4m1 0h3m2 0h2m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h3m1 0h1m1 0h4m3 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m1 0h1m2 0h2m1 0h6m2 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-12 1h1m2 0h1m-21 1h1m2 0h1m1 0h2m1 0h2m1 0h6m3 0h2m1 0h1m-24 1h1m1 0h1m1 0h1m4 0h3m1 0h2m2 0h2m1 0h4m1 0h1m2 0h1m-26 1h1m1 0h4m3 0h1m4 0h1m1 0h5m1 0h3m-26 1h2m3 0h2m1 0h2m1 0h3m3 0h1m6 0h2m-22 1h1m1 0h1m1 0h1m1 0h2m3 0h1m3 0h2m2 0h1m1 0h2m-26 1h1m4 0h5m4 0h1m1 0h3m-19 1h1m1 0h2m1 0h1m2 0h1m2 0h1m1 0h2m2 0h1m1 0h1m1 0h5m-28 1h1m1 0h1m3 0h1m1 0h2m1 0h4m1 0h2m6 0h1m1 0h1m-27 1h1m1 0h5m1 0h2m5 0h2m1 0h3m5 0h1m-26 1h1m1 0h2m4 0h2m4 0h1m1 0h1m2 0h3m1 0h1m2 0h1m-29 1h1m1 0h1m3 0h2m2 0h1m3 0h1m2 0h2m5 0h1m2 0h2m-27 1h2m1 0h1m1 0h3m1 0h2m1 0h4m2 0h1m1 0h1m4 0h2m-29 1h1m1 0h6m1 0h1m3 0h1m2 0h1m3 0h5m1 0h1m-19 1h2m2 0h1m3 0h2m1 0h2m3 0h1m1 0h3m-29 1h7m2 0h3m5 0h2m1 0h1m1 0h1m1 0h1m2 0h1m-28 1h1m5 0h1m1 0h4m1 0h1m2 0h1m1 0h1m1 0h1m3 0h5m-29 1h1m1 0h3m1 0h1m5 0h1m1 0h4m2 0h5m-25 1h1m1 0h3m1 0h1m1 0h6m2 0h2m3 0h2m1 0h4m-28 1h1m1 0h3m1 0h1m3 0h2m4 0h2m1 0h2m3 0h3m1 0h1m-29 1h1m5 0h1m2 0h3m1 0h1m1 0h6m1 0h1m4 0h1m-28 1h7m1 0h1m1 0h1m1 0h1m1 0h2m1 0h1m2 0h2m3 0h1m1 0h1\"/></svg>\n"
};
var Q2 = [['demo','3つの実演（メール・資料・定時実行）'],['ehon','絵本の事例'],['page','資料フォルダからページ作成'],['review','AI同士のレビュー・道具の直接操作'],['fail','失敗から学んだこと'],['start','指示の出し方'],['price','ツールと料金'],['rule','使うときに守ること']];
var Q3 = [['mail','メールの返信・下書き'],['doc','見積書・提案書・資料づくり'],['minutes','議事録・要約'],['data','表・データの整理'],['sns','SNS・広報'],['other','その他']];
var Q1L = {1:'不満',2:'やや不満',3:'ふつう',4:'満足',5:'とても満足'};

function api(path, opt){
  opt = opt || {}; opt.headers = Object.assign({'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'}, opt.headers||{});
  return fetch(CFG.url + '/rest/v1/' + path, opt);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function clientId(){
  var id=null; try{ id=localStorage.getItem('itec_cid'); }catch(e){}
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,function(c){return (c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16);})); try{ localStorage.setItem('itec_cid',id); }catch(e){} }
  return id;
}

/* ===== 回答ページ ===== */
function renderForm(){
  var done=false; try{ done=localStorage.getItem('itec_done')==='1'; }catch(e){}
  if(done){ document.getElementById('app').innerHTML='<div class="card done"><b>回答ありがとうございました</b>集計は前の画面でご覧ください。</div>'; return; }
  var h='<form class="card" id="f" novalidate><h1>本日の感想アンケート</h1><p class="sub">ITEC メンター・メンティー交流会「明日から使えるAI活用」</p><p class="sub">匿名です。お名前などは伺いません。1分ほどで終わります。</p>';
  h+='<fieldset><legend>Q1. 今日の話は役に立ちましたか</legend><div class="opts five">';
  for(var i=1;i<=5;i++) h+='<label class="opt"><input type="radio" name="q1" value="'+i+'"><b>'+i+'</b>'+Q1L[i]+'</label>';
  h+='</div></fieldset><fieldset><legend>Q2. 役に立った話題<small>いくつでも</small></legend><div class="opts">';
  Q2.forEach(function(o){ h+='<label class="opt"><input type="checkbox" name="q2" value="'+o[0]+'">'+esc(o[1])+'</label>'; });
  h+='</div></fieldset><fieldset><legend>Q3. 明日、AIに任せてみたい仕事<small>1つ</small></legend><div class="opts">';
  Q3.forEach(function(o){ h+='<label class="opt"><input type="radio" name="q3" value="'+o[0]+'">'+esc(o[1])+'</label>'; });
  h+='</div></fieldset><fieldset><legend>Q4. ひとこと<small>任意・200字まで・画面には映しません</small></legend><p class="note" style="margin:0 0 6px">お名前・連絡先など個人が分かることは書かないでください。</p><textarea name="q4" maxlength="200"></textarea><div class="count" id="cnt">0 / 200</div></fieldset>';
  h+='<button class="send" id="send" type="submit">送信する</button><div class="msg" id="msg" role="status"></div><p class="note">Q1とQ3は必須です。回答は1人1回でお願いします。</p></form>';
  document.getElementById('app').innerHTML=h;
  var f=document.getElementById('f'), msg=document.getElementById('msg'), btn=document.getElementById('send');
  f.q4.addEventListener('input',function(){ document.getElementById('cnt').textContent=f.q4.value.length+' / 200'; });
  f.addEventListener('submit',function(e){
    e.preventDefault(); msg.className='msg'; msg.textContent='';
    var q1=f.querySelector('input[name=q1]:checked'), q3=f.querySelector('input[name=q3]:checked');
    if(!q1||!q3){ msg.className='msg err'; msg.textContent=(!q1?'Q1':'Q3')+'を選んでください。'; return; }
    var q2=[].map.call(f.querySelectorAll('input[name=q2]:checked'),function(x){return x.value;});
    var body={client_id:clientId(), q1:+q1.value, q2:q2, q3:q3.value, q4:(f.q4.value.trim()||null)};
    btn.disabled=true; btn.textContent='送信中…';
    console.log('[survey] submit', {q1:body.q1,q2:body.q2,q3:body.q3,hasQ4:!!body.q4});
    api('itec_survey_answers',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)}).then(function(r){
      console.log('[survey] status', r.status);
      if(r.status===201){ try{ localStorage.setItem('itec_done','1'); }catch(e){} renderForm(); return; }
      return r.text().then(function(t){
        console.log('[survey] error body', t);
        msg.className='msg err';
        if(r.status===409||/duplicate/.test(t)){ msg.textContent='このブラウザからは、すでに回答済みです。'; try{ localStorage.setItem('itec_done','1'); }catch(e){} }
        else if(r.status===401||r.status===403){ msg.textContent='受付は終了しました。'; }
        else msg.textContent='送信できませんでした（'+r.status+'）。もう一度お試しください。';
        btn.disabled=false; btn.textContent='送信する';
      });
    }).catch(function(err){ console.log('[survey] network', err); msg.className='msg err'; msg.textContent='通信できませんでした。電波の良い場所でもう一度お試しください。'; btn.disabled=false; btn.textContent='送信する'; });
  });
}

/* ===== 投影用の集計画面 ===== */
function bars(map, labels, total){
  var h=''; labels.forEach(function(o){ var n=(map&&map[o[0]])||0, w=total?Math.round(n/total*100):0;
    h+='<div class="bar"><span>'+esc(o[1])+'</span><span class="t"><span class="f" style="width:'+w+'%"></span></span><span class="n">'+n+'</span></div>'; });
  return h;
}
function renderBoard(){
  document.body.style.background='var(--bg)';
  var h='<div class="board"><div class="bhead"><div><h1>本日の感想アンケート</h1><div class="total">回答<b id="tot">0</b>件</div><div class="sub" id="state"></div></div>';
  h+='<div class="qr">'+CFG.qrSvg+'<div class="url">'+esc(CFG.publicUrl.replace(/^https?:\/\//,''))+'</div></div></div>';
  h+='<div class="grid"><div class="panel"><h2>Q1. 役に立ちましたか</h2><div id="g1"></div></div><div class="panel"><h2>Q3. 明日AIに任せてみたい仕事</h2><div id="g3"></div></div>';
  h+='<div class="panel" style="grid-column:1/-1"><h2>Q2. 役に立った話題</h2><div id="g2"></div></div></div>';
  h+='<div class="bfoot"><span id="upd">読み込み中…</span><button type="button" id="reload">今すぐ更新</button></div></div>';
  document.getElementById('app').innerHTML=h;
  var Q1B=[5,4,3,2,1].map(function(i){return [String(i), i+' '+Q1L[i]];});
  function load(){
    api('rpc/itec_survey_summary',{method:'POST',body:'{}'}).then(function(r){ return r.json().then(function(j){ return [r.status,j]; }); }).then(function(x){
      var s=x[1]; console.log('[board] status', x[0], 'total', s && s.total);
      if(x[0]!==200){ document.getElementById('upd').textContent='更新できませんでした（'+x[0]+'）'; return; }
      document.getElementById('tot').textContent=s.total;
      document.getElementById('state').textContent=s.is_open?'受付中':'受付を終了しました';
      document.getElementById('g1').innerHTML=bars(s.q1,Q1B,s.total);
      document.getElementById('g3').innerHTML=bars(s.q3,Q3,s.total);
      document.getElementById('g2').innerHTML=bars(s.q2,Q2,s.total);
      document.getElementById('upd').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP')+'（5秒ごとに自動更新）　ひとこと '+s.comments+'件';
    }).catch(function(e){ console.log('[board] network', e); document.getElementById('upd').textContent='通信できませんでした。前回の結果を表示しています。'; });
  }
  document.getElementById('reload').addEventListener('click',load);
  load(); setInterval(load,5000);
}
console.log('[survey] view', location.search);
if(/[?&]view=board\b/.test(location.search)) renderBoard(); else renderForm();
</script>
</body>
</html>
