<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ITECメンター・メンティー勉強会の講義資料ページです（合言葉が必要です）。">
<meta property="og:title" content="明日から使えるAI活用">
<meta name="robots" content="noindex">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style>
<title>明日から使えるAI活用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Gamma風：淡い水色の背景に白いカードを重ねる。単一テーマで配色を固定 */
:root{
  --bg:#DEEEFF; --card:#FFFFFF; --edge:#BBD9F5; --callout:#CEE6FD; --soft:#EEF5FE;
  --head:#091C53; --ink:#1E3063; --ink2:#44527A; --mute:#6C7898; --link:#0540AD; --accent:#0B5CD5;
  --red:#B4412B; --green:#1F7A57; --line:#D6E4F5;
  --ease:cubic-bezier(0.22,1,0.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans","Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.75;padding-inline:16px;padding-block:28px 48px}
h1,h2,h3{font-family:"Instrument Sans","Noto Sans JP",sans-serif;color:var(--head);text-wrap:balance;line-height:1.3;margin:0;font-weight:600}
h1,h2{font-weight:700}
p{margin:0}
a{color:var(--link)}
main{display:contents}
.wrap{max-width:1000px;margin:0 auto}
/* カード＝1ページ */
.hero,section{max-width:1000px;margin:0 auto 32px;background:var(--card);border-radius:19px;box-shadow:0 0 0 1px var(--edge),6px 6px 0 0 var(--edge);overflow:hidden}
.hero .wrap,section .wrap{padding:52px clamp(22px,5vw,60px)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-right:0;padding-block:0}
.hero .text{padding-block:56px}
.hero h1{font-size:clamp(34px,5vw,50px);margin-block:12px 16px}
.hero .sub{color:var(--ink2);font-size:16px}
.hero .facts{display:grid;gap:12px;margin-top:22px}
.hero .facts div{background:var(--callout);border-radius:10px;padding:12px 16px}
.hero .facts b{display:block;color:var(--head);font-size:16px}
.hero .facts span{font-size:14px}
.hero .art{align-self:stretch;background:var(--callout);border-radius:120px 0 0 0;display:grid;place-items:center;padding:36px 28px}
.hero .art img{border-radius:12px;width:100%;aspect-ratio:16/10;object-fit:cover;box-shadow:0 10px 30px rgba(9,28,83,.18)}
section h2{font-size:clamp(24px,3.2vw,34px);margin-block:6px 16px}
.lead{color:var(--ink2);max-width:62ch}
.grid{display:grid;gap:14px;margin-top:22px}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.box{background:var(--soft);border-radius:12px;padding:18px 20px}
.box h3{font-size:17px;margin-bottom:6px}
.box p{color:var(--ink2);font-size:15px}
.dark{background:var(--callout)} .dark h3{color:var(--head)} .dark p{color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;counter-reset:f}
.flow .box{position:relative;padding-top:50px}
.flow .box::before{counter-increment:f;content:counter(f);position:absolute;top:16px;left:20px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:18px}
.stat b{display:block;font-size:44px;font-weight:700;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.shot{border-radius:12px;width:100%;box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(9,28,83,.12)}
.cap{font-size:13px;color:var(--mute);margin-top:8px}
ul.roles{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
ul.roles li{display:flex;justify-content:space-between;gap:12px;background:var(--soft);border-radius:10px;padding:10px 16px;font-weight:500}
ul.roles li b{color:var(--accent)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:22px}
.tool{background:var(--soft);border-radius:10px;padding:12px 16px}
.tool b{display:block;color:var(--head)} .tool span{font-size:14px;color:var(--ink2)}
.tool.core{background:var(--callout)}
.fail h3{color:var(--red);font-size:16px}
.fail .fix{color:var(--green);font-weight:700;margin-top:8px;font-size:14px}
.key{background:var(--callout);border-radius:12px;padding:18px 22px;margin-top:18px}
.key strong{font-size:18px;color:var(--head)}
.tbl{overflow-x:auto;margin-top:18px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;min-width:620px;background:var(--card);font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}
th{background:var(--callout);color:var(--head);font-weight:600}
tr:last-child td{border-bottom:0}
.src{font-size:12px;color:var(--mute);margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.steps .box b{font-size:30px;color:var(--accent);display:block}
footer{max-width:1000px;margin:0 auto;padding-inline:8px;color:var(--ink2);font-size:14px}
footer b{color:var(--head)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* スクロール演出：画面に入ったら浮き上がって現れる（Gammaと同じ1秒・同じ曲線） */
.js-anim .rv{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.js-anim .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js-anim .rv{opacity:1;transform:none;transition:none}}
@media (max-width:760px){
  .hero .wrap,.two,.g3,.g2,.flow,.steps{grid-template-columns:1fr}
  .hero .wrap{padding-right:clamp(22px,5vw,60px)}
  .hero .text{padding-block:40px 0}
  .hero .art{border-radius:24px;margin-bottom:28px;padding:20px}
}
</style>
<style>
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:4px}
.gate form{background:var(--card);box-shadow:0 0 0 1px var(--edge),6px 6px 0 0 var(--edge);color:var(--ink);border-radius:12px;padding:28px 26px;width:min(380px,100%);display:grid;gap:14px}
.gate h1{font-size:22px;font-weight:900}
.gate p{color:var(--ink2);font-size:14px}
.gate input{font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--edge);border-radius:8px;background:var(--soft);color:var(--ink)}
.gate button{font:inherit;font-weight:700;font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.gate .err{color:var(--red);font-size:14px;min-height:1.4em;margin:0}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="eyebrow">ITEC メンター・メンティー勉強会</div>
    <h1>明日から使えるAI活用</h1>
    <p>講義資料のページです。講義でお伝えした合言葉を入力してください。</p>
    <label for="pw" class="eyebrow">合言葉</label>
    <input id="pw" type="password" inputmode="text" autocapitalize="off" required>
    <button type="submit" id="go">表示する</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

  const d = JSON.parse(document.getElementById('payload').textContent);
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById('gateForm'), err = document.getElementById('err'), go = document.getElementById('go');
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '確認中…';
    try {
      const pw = new TextEncoder().encode(document.getElementById('pw').value.trim());
      const base = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(d.s), iterations:d.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(d.i)}, key, b(d.c));
      document.body.innerHTML = new TextDecoder().decode(plain);
      document.body.querySelectorAll('script').forEach(function(o){ var n=document.createElement('script'); n.textContent=o.textContent; o.replaceWith(n); });
      window.scrollTo(0,0);
      console.log('[gate] unlocked');
    } catch (x) {
      console.log('[gate] failed', x && x.name);
      err.textContent = '合言葉が違います。もう一度入力してください。';
      go.disabled = false; go.textContent = '表示する';
    }
  });
})();
</script>
</body>
</html>
